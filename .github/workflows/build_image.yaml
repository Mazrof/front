name: push workflow

on:
  push:
    branches: ['main','dev']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: login to registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # - name: Write Env file
      #   run: |
      #    echo $DOR_ENV >> ./.env
      #   shell: bash
      #   env:
      #     DOR_ENV : ${{vars.FRONT_ENV}}
      - name: build image
        run: docker build -t ${{ vars.DOCKER_USERNAME }}/front-app:${{ github.run_number }} .
      - name: tag image
        run: docker tag ${{ vars.DOCKER_USERNAME }}/front-app:${{ github.run_number }} ${{ vars.DOCKER_USERNAME }}/front-app:latest
      - name: push image-tag
        run: docker push ${{ vars.DOCKER_USERNAME }}/front-app:${{ github.run_number }}
      - name: push image-latest
        run: docker push ${{ vars.DOCKER_USERNAME }}/front-app:latest
  trigger-a-jenkins-job:
      runs-on: ubuntu-latest
      steps:
        - id: triggerjenkinsjob
          uses: mickeygoussetorg/trigger-jenkins-job@v1
          with:
            jenkins-server:  "${{ vars.JENKINS_URL }}" # URL of the jenkins server. ex: http://myjenkins.acme.com:8080
            jenkins-job: "${{ vars.JENKINS_FRONT_PIPELINE }}" # The name of the jenkins job to run
            jenkins-username: ${{ vars.JENKINS_USER }} # user name for accessing jenkins
            jenkins-pat: ${{ vars.JENKINS_ACCESS_TOKEN }} # personal Access token for accessing Jenkins
            poll-time: 200 # how often (seconds) to poll the jenkins server for results
            timeout-value: 600 # How long (seconds) to poll before timing out the action
            verbose: true # true/false - turns on extra logging
        
